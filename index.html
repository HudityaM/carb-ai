function foods(){const my=D().foods;return`<div class="card"><h2>Not sure what's in it?</h2><p class="mut" style="margin-top:0">Take photos and Carb-Ai will estimate the carbs, ask for extra angles or details if needed, and save the food for next time.</p><button class="w" style="margin-top:0" onclick="openScan('foods')">📷 Scan an unknown food</button></div>
<div class="card"><h2>My foods</h2>${my.length?my.map((f,i)=>`<div class="food"><div>${esc(f[0])}<span class="badge">AI</span><br><small class="mut">${f[1]} g carbs</small></div><div><button class="sec" onclick="del(${i})">🗑</button> <button onclick="addC(${f[1]});tab='home';render()">Use</button></div></div>`).join(""):`<p class="mut">Foods you scan appear here.</p>`}</div>
<div class="card"><h2>Common foods</h2>${BASE.map(f=>`<div class="food"><div>${f[0]}<br><small class="mut">${f[1]} g carbs</small></div><button onclick="addC(${f[1]});tab='home';render()">Use</button></div>`).join("")}</div>${srcCard()}`}
function srcCard(){return`<div class="card"><h2>How estimates are made</h2><p class="mut" style="margin-top:0">Photo estimates are guided by these nutrition references. This prototype does not query them live.</p>${SRC.map(x=>`<span class="chip" style="cursor:default">${x}</span>`).join("")}<p class="mut" style="font-size:13px;margin-bottom:0">Dosing uses TDD, ICR (500 rule), ISF (1800 rule) and an optional HOMA-IR scaling. Educational formulas, not medical advice.</p></div>`}
function del(i){D().foods.splice(i,1);sv();render()}
/* ---------- scan sheet ---------- */
function openScan(t){scan={t:t||"home",files:[],urls:[],det:"",st:"in",rd:0,ask:[],ans:"",items:[],tot:"",name:"",err:"",note:""};sheet()}
function closeS(){const e=$("#sh"),sc=scan;e.classList.add("out");setTimeout(()=>{e.classList.remove("on","out");if(scan===sc)scan=null},320)}
function addPh(i){for(const f of i.files){scan.files.push(f);scan.urls.push(URL.createObjectURL(f))}sheet()}
function sheet(){const s=scan,e=$("#sh"),first=!e.classList.contains("on");e.classList.add("on");e.classList.remove("out");let b="";
const ph=`<input type="file" id="pf" accept="image/*" multiple hidden onchange="addPh(this)"><div class="th">${s.urls.map(u=>`<img src="${u}">`).join("")}</div><button class="sec w" onclick="$('#pf').click()">📷 ${s.files.length?"Add another angle":"Take or choose photos"}</button>`;
if(s.st=="in")b=`<h3>Scan your food</h3><p class="mut" style="margin-top:0">Best results: one photo from above, one from the side, with a fork, coin or hand beside it for size.</p>${ph}
<label>Details (ingredients, portion size, restaurant, sauces, oil)</label><textarea rows="3" oninput="scan.det=this.value">${esc(s.det)}</textarea>${s.err?`<div class="warn">${esc(s.err)}</div>`:""}<button class="w" ${s.files.length?"":"disabled"} onclick="analyze()">Analyze with AI</button>`;
else if(s.st=="busy")b=`<div style="text-align:center;padding:18px 0"><div class="pulse">🍽️</div><p style="margin:10px 0 4px"><b>Analyzing your meal</b></p><p class="mut" style="margin:0 0 14px">Identifying foods, portion size and hidden carbs…</p><div class="bar"><i></i></div></div>`;
else if(s.st=="ask")b=`<h3>A little more info, please</h3>${s.ask.map(a=>`<div class="m" style="max-width:100%;margin-bottom:6px">${esc(a)}</div>`).join("")}${ph}<label>Your answer</label><textarea rows="3" oninput="scan.ans=this.value">${esc(s.ans)}</textarea><button class="w" onclick="analyze()">Send and re-analyze</button>`;
else if(s.st=="cant")b=`<h3>Can't estimate yet</h3><p>${esc(s.note||"The photos and details aren't enough for a reliable number.")}</p>${ph}<label>More details</label><textarea rows="3" oninput="scan.ans=this.value"></textarea><button class="w" onclick="scan.rd=0;analyze()">Try again</button>`;
else b=`<h3>Estimated carbs</h3>${s.items.map(i=>`<div class="food"><span>${esc(i.n)}</span><b>${i.c} g</b></div>`).join("")}<label>Total carbs (g), edit if you know better</label><input type="number" value="${s.tot}" oninput="scan.tot=this.value"><label>Name to save</label><input value="${esc(s.name)}" oninput="scan.name=this.value">${s.note?`<p class="mut">${esc(s.note)}</p>`:""}
<div class="row"><button class="w sec" onclick="saveF()">⭐ Save to my foods</button><button class="w" onclick="useS()">Use in meal</button></div><div class="warn">Estimate only. Portions and hidden ingredients change the real number.</div>`;
const ch=s.last!=s.st;s.last=s.st;e.innerHTML=`<div class="in${first?" up":""}"><div style="text-align:right"><button class="sec" onclick="closeS()">✕</button></div><div class="sb${ch?" an":""}">${b}</div></div>`}
async function analyze(){const s=scan;if(s.ans){s.det+="\nUser answer: "+s.ans;s.ans=""}const prev=s.st;s.st="busy";sheet();s.err="";
try{const sm=await claude.use("sample");if(!sm)throw"x";const lim=await sm.limits();if(!lim.images)throw"x";s.rd++;
const r=await sm.json(`You estimate carbohydrates in food from photos for a person with type 1 diabetes. Calibrate against reference nutrition data from USDA FoodData Central, Open Food Facts, the Australian Food Composition Database, Nutrition5k, NutriBench, Carbs & Cals, CalorieKing and Diabetes UK carb-counting guidance, and take care with cooked vs raw weights and portion depth. This is analysis round ${s.rd} of 3. User details so far: ${s.det||"none"}.
Rules: never invent numbers. If key info is missing (another angle, portion size or a size reference, ingredients, sauces, oil, preparation), return status "need_more" with 1-3 short, specific requests in "ask" (only allowed when round is below 3). Otherwise return status "done" with each item and carbs_g. If you truly cannot estimate, status "done" with total_carbs null and explain in note.
Reply ONLY with JSON: {"status":"need_more"|"done","ask":[string],"items":[{"name":string,"carbs_g":number}],"total_carbs":number|null,"confidence":"low"|"medium"|"high","note":string}`,{images:s.files,cache:false,modelTier:"complex"});
if(r.status=="need_more"&&s.rd<3&&r.ask&&r.ask.length){s.ask=r.ask;s.st="ask"}
else if(r.total_carbs==null){s.note=r.note;s.st="cant"}
else{s.items=(r.items||[]).map(i=>({n:i.name,c:rnd(+i.carbs_g||0)}));s.tot=rnd(+r.total_carbs);s.name=s.items.map(i=>i.n).join(", ").slice(0,40);s.note=(r.confidence?"Confidence: "+r.confidence+". ":"")+(r.note||"");s.st="done";toast("✓ Analysis complete")}}
catch(e){s.st=prev=="busy"?"in":prev;s.err="Photo analysis failed: "+((e&&e.message)||"please try again")+".";s.rd=Math.max(0,s.rd-1)}
sheet()}
function saveF(){if(!(+scan.tot>=0)||!scan.name.trim())return toast("Add a name and carbs");D().foods.unshift([scan.name.trim(),rnd(+scan.tot)]);sv();closeS();toast("Saved to My foods");if(tab=="foods")render()}
function useS(){M.c=rnd(+scan.tot);M.note=scan.name;closeS();tab="home";render()}
/* ---------- chat ---------- */
const bi=m=>m.content?esc(m.content).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>"):'<span class="dots"><span></span><span></span><span></span></span>';
const bub=(m,n)=>`<div class="m ${m.role=="user"?"u":""}${n?" nw":""}">${bi(m)}</div>`;
function chatV(){return`<div class="chatv"><div id="msgs"></div><div id="qp"></div><div class="comp"><textarea id="ci" rows="1" placeholder="Ask about carbs, doses, foods…" oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send()}"></textarea><button onclick="send()" aria-label="Send">➤</button></div></div>`}
function rc(nw){const m=$("#msgs");if(!m)return;m.innerHTML=`<div class="m">Hi ${esc(P().name||cur)}! I'm your Carb-Ai assistant. Ask me about carbs, ICR and ISF, or how a dose was worked out.</div>`+chat.map((x,i)=>bub(x,nw&&i>=chat.length-2)).join("");m.scrollTop=m.scrollHeight;
$("#qp").innerHTML=chat.length?"":["How many carbs in a samosa?","Explain my dose","What is ICR?","Tips for restaurant meals"].map(q=>`<span class="chip" onclick="send('${q}')">${q}</span>`).join("")}
async function send(q){const i=$("#ci");const t=(q||(i&&i.value)||"").trim();if(!t||cbusy)return;if(i)i.value="";cbusy=true;chat.push({role:"user",content:t},{role:"assistant",content:""});rc(1);
try{const sm=await claude.use("sample");if(!sm)throw"x";const h=chat.slice(0,-1).map(m=>({role:m.role,content:m.content}));
const p=ready()?`Age ${P().age}, ${P().weight} kg, insulin resistance: ${P().resist}. App settings ICR 1:${params().icr}, ISF ${params().isf}.`:"Profile not set up yet.";
h[0].content="You are the assistant inside Carb-Ai, a prototype app for people with type 1 diabetes. Be warm, short and clear. Help with carb estimates, food questions and how the app's bolus formula works (units = carbs/ICR + (glucose-target)/ISF). Never tell the user to take a specific insulin dose yourself; say the app gives an estimate and they must confirm with their doctor or diabetes educator. Patient: "+p+"\n\nUser: "+h[0].content;
const r=await sm(h,{cache:false,modelTier:"quick",onText:e=>{chat[chat.length-1].content=e.text;const m=$("#msgs");if(m){m.lastElementChild.innerHTML=bi(chat[chat.length-1]);m.scrollTop=m.scrollHeight}}});chat[chat.length-1].content=r.text}
catch(e){chat[chat.length-1].content="Sorry, I couldn't reach the AI: "+((e&&e.message)||"please try again")+"."}
cbusy=false;{const m=$("#msgs");if(tab=="chat"&&m&&m.lastElementChild)m.lastElementChild.innerHTML=bi(chat[chat.length-1])}}
/* ---------- history & profile ---------- */
function hist(){const h=D().hist;return`<div class="card"><h2>Meal history</h2>${h.length?h.map(x=>`<div class="hist"><b>${esc(x.n)}</b>: ${x.c} g carbs, ${x.u} U<br><small class="mut">${esc(x.t)}</small></div>`).join("")+`<button class="w sec" onclick="dl()">⬇ Download CSV</button>`:`<p class="mut">No meals saved yet.</p>`}</div>`}
async function dl(){try{const d=await claude.use("downloads");if(!d)return toast("Download unavailable");const r=["time,meal,carbs_g,units",...D().hist.map(h=>[h.t,h.n,h.c,h.u].map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(","))];await d.save({filename:"carb-ai-history.csv",data:new Blob([r.join("\n")],{type:"text/csv"})})}catch(e){}}
const seg=(k,o,v)=>`<div class="seg s p" style="--n:${o.length};--i:${Math.max(0,o.findIndex(x=>x[0]==v))}"><i class="pill"></i>${o.map(x=>`<button class="${x[0]==v?"on":""}" onclick="setU('${k}','${x[0]}',this)">${x[1]}</button>`).join("")}</div>`;
const bdg=on=>on?`<span class="badge">custom unit</span>`:"";
function ms(){const p=P(),dh=p.sys=="imperial"?"ftin":"cm",dw=p.sys=="imperial"?"lb":"kg",cm=+p.height||0,kg=+p.weight||0,ti=cm/IN,ft=cm?Math.floor(ti/12):"",inch=cm?rnd(ti-ft*12):"";
return`<div class="lh"><label>Height ${bdg(p.hu!=dh)}</label>${seg("hu",[["cm","cm"],["ftin","ft + in"]],p.hu)}</div>
${p.hu=="cm"?`<input type="number" inputmode="decimal" value="${cm?rnd(cm):""}" placeholder="e.g. 165" oninput="setH(this.value)" style="margin-top:6px">`:`<div class="row" style="margin-top:6px"><input id="hf" type="number" inputmode="numeric" value="${ft}" placeholder="feet" oninput="setHI()"><input id="hi" type="number" inputmode="decimal" value="${inch}" placeholder="inches" oninput="setHI()"></div>`}
<div class="lh"><label>Weight ${bdg(p.wu!=dw)}</label>${seg("wu",[["kg","kg"],["lb","lbs"]],p.wu)}</div>
<input type="number" inputmode="decimal" value="${kg?(p.wu=="lb"?rnd(kg/LB):rnd(kg)):""}" placeholder="${p.wu=="lb"?"e.g. 130":"e.g. 60"}" oninput="setW(this.value)" style="margin-top:6px">`}
function swap(){const e=$("#ms");if(!e)return;e.style.height=e.offsetHeight+"px";e.classList.add("fo");setTimeout(()=>{e.innerHTML=ms();e.classList.remove("fo");e.style.height=e.scrollHeight+"px";setTimeout(()=>e.style.height="",380)},170)}
function setSys(x){const p=P();p.sys=x;p.hu=x=="imperial"?"ftin":"cm";p.wu=x=="imperial"?"lb":"kg";sv();document.querySelectorAll(".sys button").forEach(b=>b.classList.toggle("on",b.dataset.s==x));swap()}
function setU(k,v,b){P()[k]=v;sv();if(b){const q=[...b.parentNode.querySelectorAll("button")];q.forEach(x=>x.classList.toggle("on",x===b));b.parentNode.style.setProperty("--i",q.indexOf(b))}if(k=="resist")$("#irw").classList.toggle("on",v=="yes");else swap()}
function setH(v){P().height=+v>0?+v:"";sv()}
function setHI(){const f=+$("#hf").value||0,i=+$("#hi").value||0;P().height=f||i?Math.round((f*12+i)*IN*100)/100:"";sv()}
function setW(v){P().weight=+v>0?(P().wu=="lb"?+v*LB:+v):"";sv()}
function saveP(){if(!ready())return toast("Add age, height and weight first");sv();tab="home";render();toast("✓ Profile saved")}
function prof(){const p=P();norm(p);const f=(k,l,t="number")=>`<label>${l}</label><input type="${t}" value="${esc(p[k])}" oninput="P().${k}=this.value;sv()">`;
return`<div class="card"><h2>Choose your measurement system</h2><div class="sys">${[["metric","Metric","cm · kg"],["imperial","Imperial","ft + in · lbs"]].map(x=>`<button data-s="${x[0]}" class="${p.sys==x[0]?"on":""}" onclick="setSys('${x[0]}')"><b>${x[1]}</b><br><small>${x[2]}</small><i class="ck">✓</i></button>`).join("")}</div><p class="mut" style="margin:10px 0 0;font-size:13px">You can still switch height or weight to any unit below.</p></div>
<div class="card"><h2>About ${esc(cur)}</h2>${f("name","Display name","text")}<div class="row"><div>${f("age","Age")}</div><div><label>Gender</label><select onchange="P().gender=this.value;sv()">${["","Female","Male","Other"].map(g=>`<option ${p.gender==g?"selected":""}>${g}</option>`).join("")}</select></div></div>
<div id="ms">${ms()}</div>
<div class="lh"><label>Insulin resistance <button class="ib" onclick="$('#irt').classList.toggle('on')">i</button></label>${seg("resist",[["no","No"],["yes","Yes"]],p.resist)}</div>
<div class="col" id="irt"><div><div class="warn" style="margin:8px 0 0">When the body responds poorly to insulin, the same dose lowers glucose less than expected, so doses can need to be larger. A HOMA-IR number lets Carb-Ai scale your estimate.</div></div></div>
<div class="col ${p.resist=="yes"?"on":""}" id="irw"><div><label>HOMA-IR value</label><input type="number" step="0.1" inputmode="decimal" value="${esc(p.ir)}" placeholder="e.g. 3.2" oninput="P().ir=this.value;sv()"><p class="mut" style="margin:6px 0 0;font-size:13px">HOMA-IR = fasting glucose (mg/dL) × fasting insulin (µU/mL) ÷ 405. Under about 2.0 is typical; above 2.5 suggests resistance.</p></div></div></div>
<div class="card"><h2>Pump settings (optional)</h2><p class="mut" style="margin-top:0">Leave blank to use estimates. Values entered here override the formulas.</p><div class="row"><div>${f("icr","ICR (g per unit)")}</div><div>${f("isf","ISF (mg/dL per unit)")}</div></div>${f("target","Target glucose (mg/dL)")}
<button class="w" onclick="saveP()">Save and continue</button></div>`}
const ss=LS.cai_session;if(ss&&U[ss]){cur=ss;tab=ready()?"home":"prof";shell(1)}else auth();
</script></body></html>
